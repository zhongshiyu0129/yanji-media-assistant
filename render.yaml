services:
  - type: web
    name: yanji-media-assistant
    runtime: node
    plan: starter
    buildCommand: npm install && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: YANJI_DATA_DIR
        value: /var/data
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: SERPER_API_KEY
        sync: false
      - key: PUBLIC_DAILY_AI_LIMIT
        value: "10"
      - key: PUBLIC_DAILY_SEARCH_LIMIT
        value: "20"
      - key: PUBLIC_DAILY_AI_LIMIT_TOTAL
        value: "100"
      - key: PUBLIC_DAILY_SEARCH_LIMIT_TOTAL
        value: "300"
      - key: PUBLIC_PROJECT_LIMIT
        value: "8"
    disk:
      name: yanji-data
      mountPath: /var/data
      sizeGB: 1
